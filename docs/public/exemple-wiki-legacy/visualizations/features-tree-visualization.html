<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbre fonctionnel</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; }
  header { background: linear-gradient(135deg, #1e293b, #0f172a); border-bottom: 1px solid #334155; padding: 1.25rem 1.5rem; }
  header h1 { color: #f1f5f9; font-size: 1.4rem; font-weight: 600; }
  header p { color: #94a3b8; font-size: .9rem; margin-top: .25rem; }
  .info-bar, .controls { background: #1e293b; border-bottom: 1px solid #334155; padding: .6rem 1.5rem;
         display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: center; font-size: .85rem; color: #94a3b8; }
  .info-bar strong { color: #e2e8f0; }
  .hint { margin-left: auto; color: #64748b; }
  button, .toggle-btn { background: #334155; border: 1px solid #475569; color: #e2e8f0; padding: .35rem .8rem;
         border-radius: 6px; cursor: pointer; font-size: .85rem; }
  button:hover, .toggle-btn:hover { background: #475569; }
  button.active, .toggle-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .controls { gap: .5rem; }
  .sep { width: 1px; height: 1.5rem; background: #475569; margin: 0 .25rem; }
  #chart { flex: 1; min-height: 650px; }
  .legend { background: #1e293b; border-top: 1px solid #334155; padding: .75rem 1.5rem;
         display: flex; flex-wrap: wrap; gap: 1.25rem; font-size: .8rem; color: #94a3b8; }
  .legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .dot { width: 12px; height: 12px; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>Arbre fonctionnel</h1>
  <p>Legacy Classified Ads — domaines, features et fonctions principales</p>
</header>
<div class="controls">
  <button onclick="setView('treemap', this)">Treemap</button>
  <button onclick="setView('sunburst', this)">Sunburst</button>
  <div class="sep"></div>
  <button class="active" onclick="setView('tree', this)">Arbre</button>
  <span class="hint">Clic : zoomer dans un domaine · Survol : détail</span>
</div>
<div id="chart"></div>
<div class="legend"><span><i class="dot" style="background:#3b82f6;border-radius:3px"></i>Référentiels</span><span><i class="dot" style="background:#8b5cf6;border-radius:3px"></i>Comptes</span><span><i class="dot" style="background:#10b981;border-radius:3px"></i>Annonces</span><span><i class="dot" style="background:#f59e0b;border-radius:3px"></i>Interactions</span><span><i class="dot" style="background:#ef4444;border-radius:3px"></i>Administration</span></div>
<script>
const treeData = {"name": "Features", "children": [{"name": "Référentiels", "children": [{"name": "Pages Statiques", "children": [{"name": "Affichage d'une page par slug", "value": 1}, {"name": "Liens dynamiques dans le pied de page", "value": 1}]}, {"name": "Catégories", "children": [{"name": "Affichage de l'arbre", "value": 1}, {"name": "Création, édition, suppression, réordonnancement (admin)", "value": 1}]}, {"name": "Régions", "children": [{"name": "Affichage de l'arbre", "value": 1}, {"name": "CRUD et réordonnancement (admin)", "value": 1}]}, {"name": "Durées d'Expiration", "children": [{"name": "CRUD et ordre des durées (jours)", "value": 1}]}]}, {"name": "Comptes", "children": [{"name": "Notifications Email", "children": [{"name": "Interpolation de templates", "value": 1}, {"name": "Envoi via mail()", "value": 1}]}, {"name": "Authentification", "children": [{"name": "Login / logout", "value": 1}, {"name": "Mot de passe perdu (envoi par email)", "value": 1}, {"name": "Identification de l'administrateur (id = 1)", "value": 1}]}, {"name": "Gestion du Compte Utilisateur", "children": [{"name": "Inscription et activation par email", "value": 1}, {"name": "Édition du profil, changement de mot de passe", "value": 1}, {"name": "Consultation du profil public d'un utilisateur", "value": 1}]}]}, {"name": "Annonces", "children": [{"name": "Recherche et Consultation d'Annonces", "children": [{"name": "Recherche par mots-clés, catégorie, région, prix", "value": 1}, {"name": "Détail de l'annonce avec avis, miniature/image", "value": 1}, {"name": "Impression", "value": 1}]}, {"name": "Dépôt d'Annonce", "children": [{"name": "Validation des champs", "value": 1}, {"name": "Upload image (JPEG, 512 Ko) et miniature 150x150", "value": 1}, {"name": "Création de compte implicite", "value": 1}, {"name": "Activation immédiate (connecté) ou par email (anonyme)", "value": 1}]}, {"name": "Cycle de Vie de l'Annonce", "children": [{"name": "Activation", "value": 1}, {"name": "Modification (dont image)", "value": 1}, {"name": "Prolongation de N jours", "value": 1}, {"name": "Suppression", "value": 1}]}]}, {"name": "Interactions", "children": [{"name": "Favoris", "children": [{"name": "Ajout / retrait", "value": 1}, {"name": "Liste paginée", "value": 1}]}, {"name": "Avis et Notation", "children": [{"name": "Avis annonce (un par couple annonce/utilisateur)", "value": 1}, {"name": "Avis utilisateur", "value": 1}]}, {"name": "Interactions sur Annonce", "children": [{"name": "Réponse (email au déposant)", "value": 1}, {"name": "Signalement (email à l'administrateur)", "value": 1}, {"name": "Envoi de l'annonce par email", "value": 1}]}]}, {"name": "Administration", "children": [{"name": "Modération et Bannissement", "children": [{"name": "Bannir depuis le front", "value": 1}, {"name": "Consulter / supprimer les bannis", "value": 1}, {"name": "Blocage silencieux au dépôt", "value": 1}]}, {"name": "Back-office d'Administration", "children": [{"name": "Login admin, profil, mot de passe", "value": 1}, {"name": "CRUD annonces, utilisateurs, réponses, signalements, avis", "value": 1}, {"name": "Sponsorisation / dé-sponsorisation", "value": 1}, {"name": "Gestion des référentiels et des contenus statiques", "value": 1}]}]}]};
const DOMAIN_COLORS = {"Référentiels": "#3b82f6", "Comptes": "#8b5cf6", "Annonces": "#10b981", "Interactions": "#f59e0b", "Administration": "#ef4444"};
function assignColors(node, parentColor) {
  const color = DOMAIN_COLORS[node.name] || parentColor;
  if (color) node.itemStyle = Object.assign({}, node.itemStyle, { color });
  (node.children || []).forEach(c => assignColors(c, color));
}
treeData.children.forEach(c => assignColors(c, null));

const chart = echarts.init(document.getElementById('chart'), 'dark');
const tooltip = { backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' },
  formatter: p => (p.treePathInfo || []).slice(1).map(x => x.name).join(' › ') || p.name };

function getOptionForView(view) {
  const base = { backgroundColor: '#0f172a', tooltip };
  if (view === 'treemap') return Object.assign(base, { series: [{
    type: 'treemap', data: treeData.children, leafDepth: 2, roam: false, width: '96%', height: '88%',
    label: { fontSize: 11 },
    levels: [
      { itemStyle: { borderColor: '#0f172a', borderWidth: 4, gapWidth: 4 },
        upperLabel: { show: true, height: 30, color: '#fff', fontSize: 14, fontWeight: 600 } },
      { itemStyle: { borderColor: '#1e293b', borderWidth: 2, gapWidth: 2 },
        upperLabel: { show: true, height: 24, color: '#e2e8f0', fontSize: 12 } },
      { itemStyle: { borderColorSaturation: 0.6, borderWidth: 1, gapWidth: 1 }, colorSaturation: [0.35, 0.6] }
    ],
    breadcrumb: { itemStyle: { color: '#334155', borderColor: '#475569' } }
  }] });
  if (view === 'sunburst') return Object.assign(base, { series: [{
    type: 'sunburst', data: treeData.children, radius: ['10%', '90%'],
    emphasis: { focus: 'ancestor' }, itemStyle: { borderColor: '#0f172a', borderWidth: 1 },
    levels: [
      {},
      { r0: '10%', r: '35%', label: { rotate: 'tangential', fontSize: 13, fontWeight: 600 } },
      { r0: '35%', r: '62%', label: { rotate: 'tangential', fontSize: 11 } },
      { r0: '62%', r: '90%', label: { rotate: 'radial', fontSize: 9, align: 'right' } }
    ]
  }] });
  return Object.assign(base, { series: [{
    type: 'tree', data: [treeData], orient: 'LR', initialTreeDepth: 3, expandAndCollapse: true,
    top: '3%', bottom: '3%', left: '8%', right: '22%', symbolSize: 8,
    emphasis: { focus: 'descendant' },
    label: { position: 'left', align: 'right', fontSize: 11, color: '#e2e8f0' },
    leaves: { label: { position: 'right', align: 'left' } },
    lineStyle: { color: '#475569', width: 1.5, curveness: 0.5 },
    itemStyle: { color: '#3b82f6', borderColor: '#3b82f6' }
  }] });
}

function setView(view, btn) {
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  chart.clear();
  chart.setOption(getOptionForView(view));
}
window.addEventListener('resize', () => chart.resize());
chart.setOption(getOptionForView('tree'));
</script>
</body>
</html>
